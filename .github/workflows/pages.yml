name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website
        shell: bash
        run: |
          mkdir _site
          while IFS= read -r -d '' path; do
            case "$path" in
              functions/*|.github/*|firebase.json|firestore.rules|.firebaserc|FIREBASE_SETUP.md|skills-lock.json)
                continue
                ;;
              .*|*/.*)
                continue
                ;;
            esac
            mkdir -p "_site/$(dirname "$path")"
            cp "$path" "_site/$path"
          done < <(git ls-files -z)
          touch _site/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

