<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prihlásenie do výučbových materiálov cez povolený Google účet.">
  <title>Prihlásenie | Programovanie SPS</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f6fa; color: #1c2330; }
    main { width: min(100% - 2rem, 520px); padding: 2rem; border: 1px solid #d9dee7; border-radius: 16px; background: #fff; box-shadow: 0 12px 40px #18243b12; }
    h1 { margin-top: 0; }
    p { color: #536176; }
    button { padding: .75rem 1rem; border: 0; border-radius: 8px; background: #1f6feb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .6; }
    #google-sign-out { margin-left: .5rem; background: #596579; }
    #auth-status { min-height: 3em; }
    #auth-original-site { display: inline-block; margin-top: .5rem; padding: .65rem .9rem; border-radius: 8px; background: #1f6feb; color: #fff; text-decoration: none; }
    #auth-original-site[hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #12161d; color: #e6eaf1; }
      main { background: #1b212b; border-color: #2d3644; }
      p { color: #a5b0c0; }
    }
  </style>
  <script type="module" src="login.js"></script>
</head>
<body>
  <main>
    <h1>Prihlásenie</h1>
    <p>Výučbové stránky sú dostupné iba po prihlásení povoleným Google účtom.</p>
    <p id="auth-status" role="status" aria-live="polite">Pokračujte cez Google.</p>
    <a id="auth-original-site" href="https://programovanie-sps.web.app/login.html" hidden>Prihlásiť sa na pôvodnej stránke</a>
    <button id="google-sign-in" type="button">Pokračovať cez Google</button>
    <button id="google-sign-out" type="button">Odhlásiť sa</button>
  </main>
</body>
</html>
