<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#081522">
  <meta name="description" content="Mobilné zrkadlo otvorenej prednášky.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="remote.css">
  <title>Mobilné zrkadlo prednášky</title>
</head>
<body>
  <main class="app" id="app">
    <p class="connection" id="connection" data-state="connecting" role="status" aria-live="polite">Pripájam…</p>
    <section class="mirror-view" hidden aria-label="Zrkadlo aktívnej prednášky">
      <iframe id="lesson-mirror" title="Aktuálna prednáška a jej ovládací panel" allow="autoplay; fullscreen"></iframe>
    </section>
    <p class="notice" id="notice" role="status" hidden></p>
  </main>
  <script type="module" src="remote.js"></script>
  <script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));</script>
</body>
</html>
